apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: reviews
  namespace: default
spec:
  host: reviews          # must equal the Kubernetes Service name
  subsets:
    - name: v1
      labels:
        version: v1      # matches the pod labels created by bookinfo.yaml
    - name: v2
      labels:
        version: v2
    - name: v3
      labels:
        version: v3